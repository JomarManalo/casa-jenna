    <!-- PRELOADER: first visit per browser session only. Inline so the cover paints before the big stylesheets.
         html.js = scripting on · html.cj-seen = already played this session · html.cj-ready = cover lifted / page revealed -->
    <script>
    (function () {
        // Clean URLs: links say "villa", which a web server (GitHub Pages, the local preview) serves as villa.html.
        if (location.protocol === 'file:') {
            // Opened straight from the folder (double-click): no server, so add .html back when a link is clicked.
            document.addEventListener('click', function (e) {
                var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
                if (!a) return;
                var h = a.getAttribute('href');
                if (h === './' || h === '.') a.setAttribute('href', 'index.html');
                else if (/^[a-z0-9-]+(#.*)?$/i.test(h)) a.setAttribute('href', h.replace(/^([a-z0-9-]+)/i, '$1.html'));
            }, true);
        } else {
            // On a server, old links like /villa.html still work; show them as /villa (and /index.html as /).
            try {
                var p = location.pathname;
                if (/\.html$/.test(p) && history.replaceState) {
                    history.replaceState(null, '', p.replace(/(index)?\.html$/, '') + location.search + location.hash);
                }
            } catch (e) {}
        }

        var d = document.documentElement, seen = false;
        d.className = d.className.replace(/\bno-js\b/, '') + ' js';
        try { seen = sessionStorage.getItem('cj-intro') === '1'; } catch (e) {}
        if (seen) {
            d.className += ' cj-seen';
            document.addEventListener('DOMContentLoaded', function () { d.className += ' cj-ready'; });
            return;
        }
        try { sessionStorage.setItem('cj-intro', '1'); } catch (e) {}
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, done = false;
        function finish() {
            if (done) return;
            done = true;
            d.className += ' cj-ready';
            var l = document.getElementById('cj-loader');
            if (l) { l.className += ' is-done'; setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 1800); }
        }
        setTimeout(finish, 5000); // never keep the page hidden longer than this
        if (!window.Promise) return;
        Promise.all([
            new Promise(function (r) { setTimeout(r, reduce ? 300 : 2300); }), // let the mark finish drawing
            new Promise(function (r) { if (document.readyState === 'complete') r(); else addEventListener('load', r); })
        ]).then(finish);
    })();
    </script>
    <style>
        #cj-loader { display: none; }
        .js:not(.cj-seen) #cj-loader {
            display: grid; place-items: center;
            position: fixed; inset: 0; z-index: 100000;
            background: #fbeedf;
            transition: transform 1.05s cubic-bezier(.77, 0, .18, 1), visibility 0s 1.05s;
        }
        .js:not(.cj-seen):not(.cj-ready), .js:not(.cj-seen):not(.cj-ready) body { overflow: hidden; }
        #cj-loader::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #a89752; }
        #cj-loader.is-done { transform: translateY(-100%); visibility: hidden; }
        .cj-ld { display: flex; flex-direction: column; align-items: center; transition: opacity .45s ease, transform .6s cubic-bezier(.2, .7, .2, 1); }
        .is-done .cj-ld { opacity: 0; transform: translateY(-28px) scale(.96); }
        .cj-ld svg { width: min(260px, 66vw); height: auto; overflow: visible; }
        .cj-ld path { fill: none; stroke: #a89752; stroke-width: 13; stroke-linecap: square; stroke-dasharray: 1; stroke-dashoffset: 1; animation: cjDraw .9s cubic-bezier(.45, 0, .2, 1) forwards; }
        .cj-ld .cj-ld__base { stroke-width: 20; animation-delay: 0s; }
        .cj-ld .cj-ld__wall { animation-delay: .2s; }
        .cj-ld .cj-ld__bar { animation-delay: .45s; }
        .cj-ld .cj-ld__roof { animation-delay: .6s; }
        .cj-ld p {
            margin: 26px -.35em 0 0; padding: 0;
            font: 500 22px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: .35em; text-transform: uppercase;
            color: #a89752; opacity: 0; animation: cjFadeIn .9s ease 1.3s forwards;
        }
        @keyframes cjDraw { to { stroke-dashoffset: 0; } }
        @keyframes cjFadeIn { to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .js:not(.cj-seen) #cj-loader { transition: opacity .3s, visibility 0s .3s; }
            #cj-loader.is-done { transform: none; opacity: 0; }
            .cj-ld path { animation: none; stroke-dashoffset: 0; }
            .cj-ld p { animation: none; opacity: 1; }
        }
    </style>
